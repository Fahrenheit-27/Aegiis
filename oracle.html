<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle</title>
    <style>
        :root {
            --main-bg-color: #0D0D0D;
            --sidebar-bg-color: #141414;
            --primary-color: #FF6B00;
            --text-color: #FFFFFF;
            --icon-color: #FF6B00;
            --secondary-bg-color: #1E1E1E;
            --button-hover: #FF8124;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            height: 100%;
            background-color: var(--main-bg-color);
            color: var(--text-color);
        }
        
        .app-container {
            display: flex;
            height: 100%;
        }
        
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
        }
        
        .screen-button {
            background: none;
            border: none;
            color: var(--icon-color);
            font-size: 24px;
            cursor: pointer;
            margin-left: auto;
        }
        
        .new-chat-btn {
            display: flex;
            align-items: center;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: background-color 0.2s;
        }
        
        .new-chat-btn:hover {
            background-color: var(--button-hover);
        }
        
        .new-chat-btn svg {
            margin-right: 10px;
        }
        
        .history-section {
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .date-header {
            font-size: 12px;
            color: #888;
            margin: 15px 0 10px;
        }
        
        .history-item {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .history-item:hover {
            background-color: rgba(255, 107, 0, 0.1);
        }
        
        .bottom-sidebar {
            margin-top: auto;
            padding-top: 20px;
        }
        
        .app-button {
            display: flex;
            align-items: center;
            background-color: var(--secondary-bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 15px;
            color: var(--text-color);
            margin-bottom: 15px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .new-badge {
            background-color: var(--primary-color);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }
        
        .profile-button {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .avatar {
            width: 32px;
            height: 32px;
            background-color: #1E88E5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        
        .chat-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .message {
            max-width: 80%;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            display: flex;
        }
        
        .assistant-message {
            align-self: flex-start;
        }
        
        .message-avatar {
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .ai-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .message-content {
            flex-grow: 1;
        }
        
        .message-header {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
            display: flex;
            align-items: center;
        }
        
        .input-area {
            padding: 20px;
            position: relative;
            margin-top: auto;
        }
        
        .input-container {
            background-color: var(--secondary-bg-color);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: flex-end;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .message-input {
            flex-grow: 1;
            background: none;
            border: none;
            color: var(--text-color);
            resize: none;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .input-buttons {
            display: flex;
            gap: 10px;
            padding: 10px;
        }
        
        .input-button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 20px;
            transition: color 0.2s;
        }
        
        .input-button:hover {
            color: var(--primary-color);
        }
        
        .send-button {
            background-color: var(--secondary-bg-color);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            cursor: pointer;
        }
        
        .ai-features {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .feature-button {
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: var(--secondary-bg-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            color: #888;
            cursor: pointer;
        }
        
        .footer {
            font-size: 12px;
            color: #666;
            text-align: center;
            padding: 10px;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="logo">
                oracle
                <button class="screen-button">⊡</button>
            </div>
            
            <button class="new-chat-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                New chat
            </button>
            
            <div class="history-section">
                <div class="date-header">2025-02</div>
                <div class="history-item">Analyze vulnerability in my network</div>
                <div class="history-item">How to implement zero-trust architecture</div>
                <div class="history-item">Review my encryption protocols</div>
                <div class="history-item">Explain recent ransomware techniques</div>
            </div>
            
            <div class="bottom-sidebar">
                <div class="app-button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 10px;">
                        <path d="M12 2L4 7V17L12 22L20 17V7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Get App
                    <span class="new-badge">NEW</span>
                </div>
                
                <div class="profile-button">
                    <div class="avatar">U</div>
                    <span>My Profile</span>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="chat-area">
                <div class="message assistant-message">
                    <div class="message-avatar">
                        <div class="ai-avatar">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 15C15.866 15 19 11.866 19 8C19 4.13401 15.866 1 12 1C8.13401 1 5 4.13401 5 8C5 11.866 8.13401 15 12 15Z" stroke="white" stroke-width="2"/>
                                <path d="M12 15V23M12 23H7M12 23H17" stroke="white" stroke-width="2"/>
                            </svg>
                        </div>
                    </div>
                    <div class="message-content">
                        <div class="message-header">
                            Hi, I'm Oracle.
                        </div>
                        <div>How can I help you today?</div>
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <div class="input-container">
                    <textarea class="message-input" placeholder="Message Oracle"></textarea>
                    <div class="input-buttons">
                        <button class="input-button">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M17 8L12 3L7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <button class="send-button">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="ai-features">
                    <button class="feature-button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4.5 12.75L10.5 18.75L19.5 5.25" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        OracleThink (R1)
                    </button>
                    <button class="feature-button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Search
                    </button>
                </div>
            </div>
            
            <div class="footer">
                AI-generated, for reference only
            </div>
        </div>
    </div>
</body>
</html>
